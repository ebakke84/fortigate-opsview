# FortiGate: REST-API-tilgang for Opsview over WAN (uten IPsec)
# Bytt ut <OPSVIEW_IP>, wan1 og 8443 før innliming. HA: kjør på primærnoden.
# Rekkefølgen er bevisst: local-in-policy før allowaccess https.

config firewall address
    edit "opsview"
        set subnet <OPSVIEW_IP>/32
        set comment "Opsview monitorering"
    next
end
config firewall service custom
    edit "MGMT-8443"
        set tcp-portrange 8443
    next
end
config firewall local-in-policy
    edit 10
        set intf "wan1"
        set srcaddr "opsview"
        set dstaddr "all"
        set service "MGMT-8443"
        set schedule "always"
        set action accept
        set comments "Opsview REST-API"
    next
    edit 11
        set intf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "MGMT-8443"
        set schedule "always"
        set action deny
        set comments "Blokker admin-port fra resten av internett"
    next
end
config system accprofile
    edit "ro-monitor"
        set secfabgrp read
        set ftviewgrp read
        set authgrp read
        set sysgrp read
        set netgrp read
        set loggrp read
        set fwgrp read
        set vpngrp read
        set utmgrp read
        set wifi read
    next
end
config system api-user
    edit "opsview"
        set comments "Opsview monitorering (read-only)"
        set accprofile "ro-monitor"
        set vdom "root"
        config trusthost
            edit 1
                set ipv4-trusthost <OPSVIEW_IP> 255.255.255.255
            next
        end
    next
end
config system global
    set admin-sport 8443
end
config system interface
    edit "wan1"
        append allowaccess https
    next
end

